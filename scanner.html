<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .coverage-scroll { width: 100%; overflow: hidden; }
      .coverage-grid { display: grid; grid-auto-flow: column; gap: 1px; width: 100%; min-width: 0; }
      .coverage-tick { height: 14px; min-width: 0; border-radius: 1px; }
      .coverage-tick.received { background: #16a34a; }
      .coverage-tick.missing { background: #dc2626; }
      .coverage-tick.neutral { background: #d1d5db; }
      #videoElement { display: block; width: 100%; max-width: 640px; min-height: 220px; max-height: 60vh; margin: 0 auto 1rem; background: #111827; object-fit: contain; }
      @media (max-width: 480px) {
        .coverage-grid { gap: 0; }
        .coverage-tick { height: 12px; }
        #videoElement { min-height: 200px; max-height: 55vh; }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Receiver Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>
        <video id="videoElement" muted autoplay playsinline></video>
        <section class="w-full max-w-2xl px-3 mb-4" aria-label="Copertura dei blocchi">
          <div class="flex justify-between items-center text-sm mb-2">
            <span>{{received_count}} / {{has_valid_metadata ? file_metadata.chunks : '—'}} ricevuti</span>
            <span>{{completion_percent}}%</span>
          </div>
          <div v-if="has_valid_metadata" class="coverage-scroll" role="group" aria-label="Stato di ricezione dei blocchi; numeri mostrati da 1">
            <div class="coverage-grid" :style="{ gridTemplateColumns: `repeat(${coverage_ticks.length}, minmax(0, 1fr))` }">
              <span v-for="tick in coverage_ticks" :key="tick.index" class="coverage-tick" role="img"
                :class="tick.received ? 'received' : 'missing'"
                :title="tick.label"
                :aria-label="tick.label"></span>
            </div>
          </div>
          <div v-else class="h-3 rounded bg-gray-200" role="status" aria-label="In attesa di metadati validi"></div>
        </section>
        <button
          v-if="!is_receiving"
          v-on:click="start_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Receiver
        </button>
        <button
          v-else
          v-on:click="stop_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Stop Receiver
        </button>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      const { createApp, ref, reactive, onMounted, computed } = Vue;

      createApp({
        setup() {
          const user_message = ref("Click receive button to start receiving");
          const decoded_chunks = ref({});
          const total_chunks = ref(-1);
          const file_metadata = reactive({});
          const has_valid_metadata = computed(() => Number.isInteger(file_metadata.chunks) && file_metadata.chunks > 0);
          const valid_received_indices = computed(() => {
            if (!has_valid_metadata.value) return [];
            return Object.keys(decoded_chunks.value)
              .map(Number)
              .filter((index) => Number.isInteger(index) && index >= 0 && index < file_metadata.chunks);
          });
          const received_count = computed(() => valid_received_indices.value.length);
          const completion_percent = computed(() => has_valid_metadata.value
            ? Math.floor((received_count.value / file_metadata.chunks) * 100)
            : 0);
          const coverage_ticks = computed(() => {
            const received = new Set(valid_received_indices.value);
            const chunk_count = file_metadata.chunks;
            const segment_count = Math.min(chunk_count, 200);
            return Array.from({ length: segment_count }, (_, segment) => {
              const start = Math.floor((segment * chunk_count) / segment_count);
              const end = Math.floor(((segment + 1) * chunk_count) / segment_count);
              let missing_count = 0;
              for (let index = start; index < end; index++) {
                if (!received.has(index)) missing_count++;
              }
              const range = start === end - 1 ? `Blocco ${start + 1}` : `Blocchi ${start + 1}–${end}`;
              const label = missing_count
                ? `${range}: ${missing_count} mancanti`
                : `${range}: ricevuti`;
              return { index: segment, received: missing_count === 0, label };
            });
          });
          const is_receiving = ref(false);
          let canvas, context, videoElement;

          const decode_data = (input_string) => {
            const encoded_data = atob(input_string.split(",")[1]);
            const encoded_array = Array.from(encoded_data, (char) =>
              char.charCodeAt(0)
            );
            const utf8Decoder = new TextDecoder();
            const output_string = utf8Decoder.decode(
              new Uint8Array(encoded_array)
            );
            const data_array = Array.from(output_string, (char) =>
              char.charCodeAt(0)
            );
            return {
              index: parseInt(input_string.split(",")[0]),
              data: data_array,
            };
          };

          const download_file = (data, fileName) => {
            const blob = new Blob([data]);
            const dummy_element = document.createElement("a");
            const url = URL.createObjectURL(blob);
            dummy_element.href = url;
            dummy_element.download = fileName;
            dummy_element.click();
            URL.revokeObjectURL(url);
          };

          const stop_receiver = () => {
            is_receiving.value = false;
            decoded_chunks.value = {};
            Object.keys(file_metadata).forEach((key) => delete file_metadata[key]);
            user_message.value = "Click receive button to start receiving";
          };

          const start_receiver = async () => {
            if (!videoElement?.srcObject || !context || !canvas?.width || !canvas?.height) {
              user_message.value = "La fotocamera non è pronta. Controlla i permessi del browser e ricarica la pagina.";
              return;
            }
            decoded_chunks.value = {};
            Object.keys(file_metadata).forEach((key) => delete file_metadata[key]);
            is_receiving.value = true;
            while (!has_valid_metadata.value || received_count.value < file_metadata.chunks) {
              try {
                await new Promise((r) => setTimeout(r, 10));
                context.drawImage(videoElement, 0, 0);
                image_data = context.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );
                let symbols = await zbarWasm.scanImageData(image_data);
                if (!symbols || !symbols.length) {
                  continue;
                }
                let decoded_data = symbols[0].decode();
                if (decoded_data.includes("chunks")) {
                  const metadata = JSON.parse(decoded_data);
                  if (Number.isInteger(metadata.chunks) && metadata.chunks > 0) {
                    const metadata_changed = !has_valid_metadata.value ||
                      metadata.chunks !== file_metadata.chunks || metadata.name !== file_metadata.name;
                    if (metadata_changed) {
                      Object.keys(file_metadata).forEach((key) => delete file_metadata[key]);
                      decoded_chunks.value = {};
                      Object.assign(file_metadata, metadata);
                    }
                    user_message.value = `Transferring file: ${file_metadata.name}`;
                  }
                } else if (decoded_data.split(",").length == 2) {
                  let raw_data = decode_data(decoded_data);
                  if (has_valid_metadata.value && Number.isInteger(raw_data.index) && raw_data.index >= 0 && raw_data.index < file_metadata.chunks) {
                    decoded_chunks.value[raw_data.index] = raw_data.data;
                  }
                }
                window.decoded_chunks = decoded_chunks.value;
              } catch (error) {
                console.error("Error in Loop: ", error);
              }
              if (!is_receiving.value) {
                Object.keys(file_metadata).forEach((key) => delete file_metadata[key]);
                decoded_chunks.value = {};
                user_message.value = "Click receive button to start receiving";
                return true;
              }
            }
            user_message.value = "Data Transfer Complete";
            output_array = [];
            for (let i = 0; i < file_metadata.chunks; i++) {
              output_array = output_array.concat(decoded_chunks.value[i]);
            }
            let output_unit8array = Uint8Array.from(output_array);
            window.output_unit8array = output_unit8array;
            let infalted_array = pako.inflate(window.output_unit8array);
            download_file(infalted_array, file_metadata.name);
            stop_receiver();
          };

          onMounted(async () => {
            console.log("Application Initialized ...");
            videoElement = document.getElementById("videoElement");
            try {
              if (!navigator.mediaDevices?.getUserMedia) {
                throw new Error("Camera access is unavailable in this browser or page context.");
              }
              videoElement.srcObject = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
              });
              await videoElement.play();
              canvas = document.createElement("canvas");
              context = canvas.getContext("2d");
              await new Promise((resolve) => {
                if (videoElement.readyState >= 2) resolve();
                else videoElement.addEventListener("loadedmetadata", resolve, { once: true });
              });
              canvas.height = videoElement.videoHeight;
              canvas.width = videoElement.videoWidth;
              context.drawImage(videoElement, 0, 0);
            } catch (error) {
              console.error("Unable to start camera:", error);
              user_message.value = "Impossibile accedere alla fotocamera. Controlla i permessi del browser e ricarica la pagina.";
            }
          });

          return {
            user_message,
            start_receiver,
            is_receiving,
            file_metadata,
            decoded_chunks,
            stop_receiver,
            has_valid_metadata,
            received_count,
            completion_percent,
            coverage_ticks,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
